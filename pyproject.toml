[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofweave"
version = "0.1.0"
description = "Reproducible supply-chain & partnership graph for NVIDIA — every relation scored, sourced, and traceable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
proofweave = "proofweave.cli:app"

[tool.setuptools.packages.find]
include = ["proofweave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
